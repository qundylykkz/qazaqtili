<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Дыбысты тап! Жануарлар ойыны</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8FD8F4;
    --sky-bottom:#CFF3E0;
    --sun:#FFD24C;
    --card-cream:#FFFBF0;
    --ink:#3A2E2A;
    --grass-1:#8FCB6B;
    --grass-2:#6FAF52;
    --correct:#5FBF6A;
    --correct-dark:#3E8F49;
    --wrong-flash:#FF8B7B;
    --ornament:#F0A93D;
    --shadow: 0 10px 0 rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    overflow:hidden;
    touch-action:manipulation;
  }
  body{
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 65%, var(--sky-bottom) 100%);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    position:relative;
  }

  /* decorative sun */
  .sun{
    position:absolute; top:-40px; right:6%;
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFE38A, var(--sun));
    box-shadow:0 0 0 14px rgba(255,210,76,0.25);
    z-index:0;
  }
  /* decorative clouds */
  .cloud{position:absolute; background:#fff; border-radius:50px; opacity:.85; z-index:0;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .cloud1{width:90px;height:34px;top:60px;left:5%;}
  .cloud1::before{width:46px;height:46px;top:-22px;left:10px;}
  .cloud1::after{width:34px;height:34px;top:-16px;left:50px;}
  .cloud2{width:70px;height:26px;top:120px;left:60%;}
  .cloud2::before{width:34px;height:34px;top:-16px;left:8px;}
  .cloud2::after{width:26px;height:26px;top:-12px;left:38px;}

  h1{
    font-family:'Fredoka',sans-serif;
    text-align:center;
    font-size:clamp(24px,4.5vw,40px);
    margin:14px 10px 6px;
    color:#2C6E6B;
    text-shadow:0 3px 0 rgba(255,255,255,0.6);
    position:relative; z-index:2;
  }
  .subtitle{
    text-align:center;
    margin:0 0 10px;
    font-weight:600;
    color:#2C6E6B;
    opacity:.85;
    position:relative;z-index:2;
    font-size:clamp(13px,2vw,16px);
  }

  .ornament-strip{
    height:12px;
    width:100%;
    background-image: radial-gradient(circle, var(--ornament) 3px, transparent 3.5px);
    background-size:28px 12px;
    background-position:center;
    opacity:.55;
    position:relative;z-index:1;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:6px 3vw 0;
    position:relative;
    z-index:2;
    min-height:0;
  }

  /* ================= DROP ZONES ================= */
  .dropzones{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2.2vw;
    margin:8px auto 10px;
    max-width:1100px;
    width:100%;
  }
  .dropzone{
    background:rgba(255,255,255,0.55);
    border:4px dashed #ffffff;
    border-radius:26px;
    padding:10px 6px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    min-height:150px;
    justify-content:space-between;
    transition:background .25s, border-color .25s, transform .2s;
  }
  .dropzone.hover-target{
    background:rgba(255,255,255,0.9);
    border-color:var(--sun);
    transform:scale(1.04);
  }
  .dropzone.correct{
    background:linear-gradient(180deg,#DFF6E1,#C9F0CC);
    border:4px solid var(--correct-dark);
  }
  .dropzone.wrong-flash{
    animation: shake .4s ease;
    border-color:var(--wrong-flash);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  .speaker-btn{
    width:64px;height:64px;
    border-radius:50%;
    border:none;
    background:linear-gradient(180deg,#FFD98A,var(--sun));
    box-shadow:0 6px 0 #D99A1F;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .1s, box-shadow .1s;
  }
  .speaker-btn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #D99A1F;
  }
  .speaker-btn svg{width:32px;height:32px;}
  .speaker-btn.playing{
    animation:pulse .5s ease infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }

  .zone-slot{
    width:min(100%,120px);
    aspect-ratio:1/1;
    border-radius:20px;
    background:rgba(255,255,255,0.5);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .zone-label{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:clamp(11px,1.6vw,15px);
    color:#2C6E6B;
    text-align:center;
    min-height:1.2em;
  }
  .checkmark{
    position:absolute;
    top:-14px; right:-10px;
    width:34px;height:34px;
    border-radius:50%;
    background:var(--correct-dark);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    transform:scale(0);
    animation: pop-in .4s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pop-in{ to{ transform:scale(1); } }

  /* ================= CARDS TRAY ================= */
  .tray-wrap{
    position:relative;
    padding-bottom:2vh;
  }
  .grass{
    position:absolute;
    left:0;right:0;bottom:0;
    height:100%;
    background:linear-gradient(180deg,var(--grass-1),var(--grass-2));
    border-radius:40px 40px 0 0;
    z-index:-1;
  }
  .cards-tray{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:2.2vw;
    max-width:1100px;
    margin:0 auto;
    width:100%;
    padding:16px 2vw 4vh;
    position:relative;
  }
  .card{
    background:var(--card-cream);
    border-radius:24px;
    box-shadow:var(--shadow);
    border:4px solid #fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    aspect-ratio:1/1;
    max-width:170px;
    margin:0 auto;
    cursor:grab;
    user-select:none;
    touch-action:none;
    position:relative;
    transition:transform .18s, box-shadow .18s, opacity .2s;
  }
  .card .emoji{
    font-size:clamp(38px,7vw,62px);
    line-height:1;
    pointer-events:none;
  }
  .card .name{
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    margin-top:6px;
    font-size:clamp(12px,1.8vw,17px);
    color:#2C6E6B;
    pointer-events:none;
  }
  .card.dragging{
    position:fixed;
    z-index:999;
    cursor:grabbing;
    box-shadow:0 18px 24px rgba(0,0,0,0.22);
    transform:scale(1.08) rotate(-2deg);
    transition:none;
    max-width:150px;
  }
  .card.placed{
    visibility:hidden;
    pointer-events:none;
  }
  .card:focus-visible{
    outline:4px solid #2C6E6B;
    outline-offset:3px;
  }
  .card-placeholder{
    aspect-ratio:1/1;
    max-width:170px;
    margin:0 auto;
    border-radius:24px;
    border:4px dashed rgba(255,255,255,0.5);
  }

  /* ================= WIN OVERLAY ================= */
  .win-overlay{
    position:fixed; inset:0;
    background:rgba(44,110,107,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .win-overlay.show{
    display:flex;
    animation:fadeIn .3s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .win-card{
    background:var(--card-cream);
    border-radius:32px;
    padding:32px 28px;
    text-align:center;
    max-width:420px;
    box-shadow:0 20px 0 rgba(0,0,0,0.15);
    animation:pop-in .45s cubic-bezier(.34,1.56,.64,1);
  }
  .win-card .big-emoji{
    font-size:64px;
    display:block;
    margin-bottom:8px;
  }
  .win-card h2{
    font-family:'Fredoka',sans-serif;
    color:#2C6E6B;
    margin:0 0 8px;
    font-size:28px;
  }
  .win-card p{
    margin:0 0 20px;
    font-weight:600;
    color:#4a3f3a;
  }
  .replay-btn{
    font-family:'Fredoka',sans-serif;
    font-size:18px;
    font-weight:600;
    padding:14px 30px;
    border:none;
    border-radius:50px;
    background:linear-gradient(180deg,#FFD98A,var(--sun));
    box-shadow:0 6px 0 #D99A1F;
    cursor:pointer;
    color:#5c3d0a;
  }
  .replay-btn:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #D99A1F;
  }

  .confetti{
    position:absolute;
    top:-20px;
    font-size:22px;
    animation:fall linear forwards;
    pointer-events:none;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.6; }
  }

  @media (max-width:640px){
    .dropzones,.cards-tray{gap:3vw;}
    .zone-slot{width:80px;}
    .speaker-btn{width:52px;height:52px;}
    .speaker-btn svg{width:26px;height:26px;}
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<h1>Дыбысты тыңда, жануарды тап! 🐾</h1>
<p class="subtitle">Батырманы бас, дыбысты тыңда, сосын дұрыс жануарды жоғарыға сүйреп апар</p>
<div class="ornament-strip"></div>

<main>
  <section class="dropzones" id="dropzones" aria-label="Дыбыс ұяшықтары"></section>

  <div class="tray-wrap">
    <div class="grass"></div>
    <section class="cards-tray" id="cardsTray" aria-label="Жануарлар"></section>
  </div>
</main>

<!-- ==========================================================
     АУДИО ФАЙЛДАР: төмендегі src мәндерін өз mp3 файлдарыңызбен
     осы HTML файл орналасқан папкаға қойыңыз (немесе жолын өзгертіңіз).
     ========================================================== -->
<audio id="audio-horse" src="audio/horse.mp3" preload="none"></audio>
<audio id="audio-cow"   src="audio/cow.mp3"   preload="none"></audio>
<audio id="audio-sheep" src="audio/sheep.mp3" preload="none"></audio>
<audio id="audio-camel" src="audio/camel.mp3" preload="none"></audio>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <span class="big-emoji">🎉</span>
    <h2>Керемет! Сен бәрін таптың!</h2>
    <p>Барлық жануарды дұрыс таптың, жарайсың!</p>
    <button class="replay-btn" id="replayBtn">Қайта ойнау</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Жануарлар тізімі: id, атауы, эмодзи-суреті, аудио файл атауы
  const ANIMALS = [
    { id:'horse', name:'Жылқы', emoji:'🐴', audio:'horse.mp3' },
    { id:'cow',   name:'Сиыр',  emoji:'🐮', audio:'cow.mp3'   },
    { id:'sheep', name:'Қой',   emoji:'🐑', audio:'sheep.mp3' },
    { id:'camel', name:'Түйе',  emoji:'🐫', audio:'camel.mp3' },
  ];

  const dropzonesEl = document.getElementById('dropzones');
  const trayEl = document.getElementById('cardsTray');
  const winOverlay = document.getElementById('winOverlay');
  const replayBtn = document.getElementById('replayBtn');

  let solvedCount = 0;
  let dragState = null;

  const speakerSVG = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 9V15H8L13 20V4L8 9H4Z" fill="#5c3d0a"/>
      <path d="M16.5 8.5C17.5 9.5 18 10.7 18 12C18 13.3 17.5 14.5 16.5 15.5" stroke="#5c3d0a" stroke-width="2" stroke-linecap="round"/>
      <path d="M18.8 6.2C20.4 7.8 21.2 9.8 21.2 12C21.2 14.2 20.4 16.2 18.8 17.8" stroke="#5c3d0a" stroke-width="2" stroke-linecap="round"/>
    </svg>`;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function buildDropzones(){
    dropzonesEl.innerHTML = '';
    ANIMALS.forEach(animal=>{
      const zone = document.createElement('div');
      zone.className = 'dropzone';
      zone.dataset.animal = animal.id;

      const btn = document.createElement('button');
      btn.className = 'speaker-btn';
      btn.setAttribute('aria-label', animal.name + ' дыбысын тыңдау');
      btn.innerHTML = speakerSVG;
      btn.addEventListener('click', ()=> playSound(animal.id, btn));

      const slot = document.createElement('div');
      slot.className = 'zone-slot';
      slot.dataset.slotFor = animal.id;

      const label = document.createElement('div');
      label.className = 'zone-label';
      label.textContent = '?';

      zone.appendChild(btn);
      zone.appendChild(slot);
      zone.appendChild(label);
      dropzonesEl.appendChild(zone);
    });
  }

  function playSound(animalId, btnEl){
    const audio = document.getElementById('audio-' + animalId);
    if(!audio) return;
    if(btnEl){
      btnEl.classList.add('playing');
      setTimeout(()=>btnEl.classList.remove('playing'), 500);
    }
    audio.currentTime = 0;
    // mp3 файлдар әлі қосылмаса, ойнату дыбыссыз аяқталуы мүмкін — бұл қалыпты жағдай.
    audio.play().catch(()=>{ /* аудио файл әлі табылмады */ });
  }

  function buildCards(){
    trayEl.innerHTML = '';
    const shuffled = shuffle(ANIMALS);
    shuffled.forEach(animal=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.animal = animal.id;
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', animal.name + ' карточкасы, сүйреп апарыңыз');

      const emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = animal.emoji;

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = animal.name;

      card.appendChild(emoji);
      card.appendChild(name);
      trayEl.appendChild(card);

      card.addEventListener('pointerdown', onPointerDown);
    });
  }

  function onPointerDown(e){
    const card = e.currentTarget;
    if(card.classList.contains('placed')) return;
    e.preventDefault();

    const rect = card.getBoundingClientRect();
    const placeholder = document.createElement('div');
    placeholder.className = 'card-placeholder';
    card.parentNode.insertBefore(placeholder, card);

    dragState = {
      card, placeholder,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      startRect: rect
    };

    card.classList.add('dragging');
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    // Сүйреп жатқан карточканың өзі "не астында тұр?" деген тексеруге
    // кедергі жасамас үшін, уақытша пойнтер оқиғаларын өткізіп жібереміз
    card.style.pointerEvents = 'none';
    moveCardTo(e.clientX, e.clientY);

    card.setPointerCapture(e.pointerId);
    card.addEventListener('pointermove', onPointerMove);
    card.addEventListener('pointerup', onPointerUp);
    card.addEventListener('pointercancel', onPointerUp);
  }

  function moveCardTo(x,y){
    const { card, offsetX, offsetY } = dragState;
    card.style.left = (x - offsetX) + 'px';
    card.style.top = (y - offsetY) + 'px';
  }

  function onPointerMove(e){
    if(!dragState) return;
    moveCardTo(e.clientX, e.clientY);
    updateHoverTarget(e.clientX, e.clientY);
  }

  function findZoneAt(x,y){
    const el = document.elementFromPoint(x,y);
    if(!el) return null;
    return el.closest('.dropzone');
  }

  function updateHoverTarget(x,y){
    document.querySelectorAll('.dropzone.hover-target').forEach(z=>z.classList.remove('hover-target'));
    const zone = findZoneAt(x,y);
    if(zone && !zone.classList.contains('correct')){
      zone.classList.add('hover-target');
    }
  }

  function onPointerUp(e){
    if(!dragState) return;
    const { card, placeholder } = dragState;
    card.removeEventListener('pointermove', onPointerMove);
    card.removeEventListener('pointerup', onPointerUp);
    card.removeEventListener('pointercancel', onPointerUp);
    document.querySelectorAll('.dropzone.hover-target').forEach(z=>z.classList.remove('hover-target'));

    const zone = findZoneAt(e.clientX, e.clientY);
    card.classList.remove('dragging');

    if(zone && zone.dataset.animal === card.dataset.animal && !zone.classList.contains('correct')){
      placeCorrect(card, zone, placeholder);
    } else {
      if(zone && !zone.classList.contains('correct')){
        flashWrong(zone);
      }
      returnToTray(card, placeholder);
    }
    dragState = null;
  }

  function returnToTray(card, placeholder){
    card.style.position='';
    card.style.left=''; card.style.top='';
    card.style.width=''; card.style.height='';
    card.style.pointerEvents='';
    placeholder.replaceWith(card);
  }

  function flashWrong(zone){
    zone.classList.add('wrong-flash');
    setTimeout(()=>zone.classList.remove('wrong-flash'), 400);
  }

  function placeCorrect(card, zone, placeholder){
    placeholder.remove();
    const slot = zone.querySelector('.zone-slot');
    const label = zone.querySelector('.zone-label');
    const animalId = card.dataset.animal;
    const animal = ANIMALS.find(a=>a.id===animalId);

    card.style.position='';
    card.style.left=''; card.style.top='';
    card.style.width=''; card.style.height='';
    card.style.pointerEvents='';
    card.classList.add('placed-inline');
    card.style.cursor='default';
    card.style.maxWidth='100%';

    slot.innerHTML = '';
    slot.appendChild(card);
    label.textContent = animal.name;

    zone.classList.add('correct');
    const check = document.createElement('div');
    check.className='checkmark';
    check.textContent='✓';
    zone.appendChild(check);

    solvedCount++;
    if(solvedCount === ANIMALS.length){
      setTimeout(showWin, 500);
    }
  }

  function showWin(){
    winOverlay.classList.add('show');
    spawnConfetti();
  }

  function spawnConfetti(){
    const emojis = ['🎉','⭐','🌟','🎈','✨'];
    for(let i=0;i<24;i++){
      const c = document.createElement('div');
      c.className='confetti';
      c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      c.style.left = Math.random()*100 + 'vw';
      c.style.animationDuration = (2.5 + Math.random()*2) + 's';
      c.style.animationDelay = (Math.random()*1.5) + 's';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 5000);
    }
  }

  function resetGame(){
    solvedCount = 0;
    winOverlay.classList.remove('show');
    buildDropzones();
    buildCards();
  }

  replayBtn.addEventListener('click', resetGame);

  // Бастапқы құрылым
  resetGame();
})();
</script>
</body>
</html>
