<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сиқырлы ағаш — Мақал-мәтелдер</title>
<style>
  :root{
    --sky-top:#5EC4E8;
    --sky-bottom:#BDEBB0;
    --grass:#7BC950;
    --grass-dark:#5FAE3B;
    --trunk:#9C6A3E;
    --trunk-dark:#7A4E2C;
    --leaf-1:#4CAE4C;
    --leaf-2:#6FCB5F;
    --leaf-3:#3E9A46;
    --basket:#D89452;
    --basket-dark:#B06F30;
    --accent-pink:#FF6FA5;
    --accent-purple:#8A5CF6;
    --accent-yellow:#FFCD3C;
    --accent-red:#FF5A5F;
    --white:#FFFFFF;
    --ink:#3A2B22;
    --card-shadow: 0 10px 0 rgba(0,0,0,0.12);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }

  body{
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 78%);
    position:relative;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- decorative sky ---------- */
  .cloud{
    position:absolute; top:6%; width:90px; height:34px; background:#fff;
    border-radius:50px; opacity:.9; filter:drop-shadow(0 4px 0 rgba(0,0,0,0.05));
  }
  .cloud::before, .cloud::after{
    content:''; position:absolute; background:#fff; border-radius:50%;
  }
  .cloud::before{ width:46px; height:46px; top:-22px; left:10px; }
  .cloud::after{ width:34px; height:34px; top:-16px; left:48px; }
  .cloud.c1{ left:6%; animation:drift 40s linear infinite; }
  .cloud.c2{ left:60%; top:12%; transform:scale(.7); animation:drift 55s linear infinite reverse; }
  .cloud.c3{ left:30%; top:4%; transform:scale(.5); animation:drift 65s linear infinite; }
  @keyframes drift{ from{ transform:translateX(0);} to{ transform:translateX(40px);} }

  .sun{
    position:absolute; top:4%; right:6%; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFE58A, var(--accent-yellow));
    box-shadow:0 0 0 10px rgba(255,205,60,0.25);
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  .ground{
    position:absolute; left:0; right:0; bottom:0; height:18%;
    background:linear-gradient(to bottom, var(--grass) 0%, var(--grass-dark) 100%);
    border-top:6px solid #fff8;
  }
  .ground::before{
    content:''; position:absolute; top:-6px; left:0; right:0; height:14px;
    background:repeating-linear-gradient(90deg, var(--grass) 0 20px, var(--grass-dark) 20px 40px);
    clip-path: polygon(0 100%, 5% 0, 10% 100%, 15% 0, 20% 100%, 25% 0, 30% 100%, 35% 0, 40% 100%, 45% 0, 50% 100%, 55% 0, 60% 100%, 65% 0, 70% 100%, 75% 0, 80% 100%, 85% 0, 90% 100%, 95% 0, 100% 100%);
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 0;
  }
  .title{
    font-size:clamp(18px,3.6vw,28px); font-weight:800; color:#fff;
    text-shadow: 0 3px 0 rgba(0,0,0,0.18);
    margin:0; letter-spacing:0.5px;
  }
  .progress{ display:flex; gap:8px; }
  .dot{
    width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,0.5);
    border:2px solid #fff; transition:transform .25s, background .25s;
  }
  .dot.done{ background:var(--accent-yellow); transform:scale(1.15); }
  .dot.active{ box-shadow:0 0 0 5px rgba(255,255,255,0.5); }

  .listen-btn{
    position:relative; z-index:6; display:flex; align-items:center; gap:10px;
    margin:14px auto 0; width:max-content;
    background:var(--accent-pink); color:#fff; border:none; border-radius:50px;
    padding:12px 24px 12px 18px; font-size:18px; font-weight:800; font-family:inherit;
    box-shadow:0 6px 0 #C94A78; cursor:pointer;
  }
  .listen-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #C94A78; }
  .listen-btn .icon{
    width:32px; height:32px; border-radius:50%; background:#fff; color:var(--accent-pink);
    display:flex; align-items:center; justify-content:center; font-size:16px;
    animation:none;
  }
  .listen-btn.speaking .icon{ animation:wiggle .5s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{ transform:rotate(-8deg);} 50%{ transform:rotate(8deg);} }

  .proverb-caption{
    max-width:520px; margin:10px auto 0; text-align:center; font-size:clamp(14px,2.6vw,18px);
    font-weight:700; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,0.15); min-height:24px;
    padding:0 12px;
  }

  /* ---------- stage ---------- */
  .stage{
    position:relative; width:100%; height:100%;
  }

  .tree{
    position:absolute; left:50%; top:14%; transform:translateX(-50%);
    width:min(78vw,520px); height:52%;
  }
  .trunk{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:14%; height:46%; background:linear-gradient(to right, var(--trunk-dark), var(--trunk) 45%, var(--trunk-dark));
    border-radius:10px 10px 4px 4px;
  }
  .canopy{ position:absolute; top:0; left:0; right:0; height:70%; }
  .blob{
    position:absolute; border-radius:50%;
  }
  .blob.b1{ width:60%; height:60%; left:0; top:16%; background:var(--leaf-1); }
  .blob.b2{ width:55%; height:55%; right:0; top:8%; background:var(--leaf-2); }
  .blob.b3{ width:50%; height:50%; left:22%; top:0; background:var(--leaf-3); }
  .blob.b4{ width:68%; height:50%; left:16%; top:30%; background:var(--leaf-1); }

  .apple-slot{
    position:absolute; width:min(19vw,108px); height:min(19vw,108px);
    display:flex; align-items:center; justify-content:center;
  }

  .apple{
    position:relative; width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #FFEDEE, var(--accent-red) 55%, #D8322E 100%);
    box-shadow:var(--card-shadow), inset 0 -6px 10px rgba(0,0,0,0.15);
    cursor:grab; display:flex; align-items:center; justify-content:center;
    touch-action:none; transition:transform .15s, box-shadow .15s;
    border:3px solid #fff5;
  }
  .apple:active{ cursor:grabbing; }
  .apple::before{
    content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:6px; height:18px; background:#6B4226; border-radius:3px;
  }
  .apple::after{
    content:''; position:absolute; top:-12px; left:calc(50% + 4px); width:16px; height:10px;
    background:var(--leaf-1); border-radius:50% 50% 50% 0; transform:rotate(25deg);
  }
  .apple.dragging{ opacity:0.35; }
  .apple.wrong-shake{ animation:shake .45s; }
  .apple.picked-up{ transform:scale(1.08); box-shadow:0 16px 18px rgba(0,0,0,0.25); z-index:50; }
  @keyframes shake{
    0%,100%{ transform:translateX(0);}
    20%{ transform:translateX(-10px) rotate(-6deg);}
    40%{ transform:translateX(10px) rotate(6deg);}
    60%{ transform:translateX(-8px) rotate(-4deg);}
    80%{ transform:translateX(8px) rotate(4deg);}
  }

  .apple img{
    width:62%; height:62%; object-fit:contain; pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  .apple .emoji-fallback{
    font-size:min(9vw,42px); pointer-events:none; line-height:1;
  }
  .apple .label{
    position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:800; color:#fff; background:rgba(0,0,0,0.28);
    padding:2px 8px; border-radius:10px; white-space:nowrap;
  }

  .basket-wrap{
    position:absolute; left:50%; bottom:16%; transform:translateX(-50%);
    width:min(46vw,220px); text-align:center;
  }
  .basket{
    position:relative; width:100%; height:min(20vw,96px);
    background:repeating-linear-gradient(45deg, var(--basket) 0 8px, var(--basket-dark) 8px 16px);
    border-radius:0 0 40px 40px; border:5px solid var(--basket-dark);
    box-shadow:var(--card-shadow);
  }
  .basket::before{
    content:''; position:absolute; top:-14px; left:-6%; right:-6%; height:22px;
    background:var(--basket-dark); border-radius:16px;
  }
  .basket.drop-hover{ transform:scale(1.05); }
  .basket.drop-hover .basket-rim{ filter:brightness(1.2); }
  .basket-hint{
    margin-top:8px; font-weight:800; color:#3A2B22; opacity:.75; font-size:14px;
  }

  /* success apple falling clone */
  .fly-apple{
    position:fixed; width:60px; height:60px; border-radius:50%; z-index:80; pointer-events:none;
  }

  /* ---------- overlay screens ---------- */
  .overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(20,30,10,0.35); z-index:100; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .panel{
    background:#fff; border-radius:28px; padding:34px 30px; text-align:center;
    box-shadow:0 14px 0 rgba(0,0,0,0.15); max-width:340px; width:88%;
  }
  .panel h2{ margin:0 0 8px; font-size:28px; color:var(--accent-purple); }
  .panel p{ margin:0 0 20px; color:var(--ink); font-weight:600; }
  .panel .stars{ font-size:40px; margin-bottom:10px; }
  .replay-btn{
    border:none; background:var(--accent-purple); color:#fff; font-family:inherit;
    font-weight:800; font-size:17px; padding:12px 26px; border-radius:50px;
    box-shadow:0 6px 0 #6A3DD8; cursor:pointer;
  }
  .replay-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #6A3DD8; }

  .confetti-piece{
    position:fixed; top:-20px; width:10px; height:16px; z-index:110; pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  @media (max-width:420px){
    .tree{ top:12%; height:48%; }
    .basket-wrap{ bottom:14%; }
  }
</style>
</head>
<body>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="sun"></div>

  <div class="topbar">
    <h1 class="title">🌳 Сиқырлы ағаш</h1>
    <div class="progress" id="progress"></div>
  </div>

  <button class="listen-btn" id="listenBtn" type="button">
    <span class="icon">🔊</span>
    <span>Мақалды тыңдау</span>
  </button>
  <div class="proverb-caption" id="proverbCaption"></div>

  <div class="stage">
    <div class="tree" id="tree">
      <div class="canopy">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="blob b4"></div>
      </div>
      <div class="trunk"></div>
      <!-- apple slots injected here -->
    </div>

    <div class="basket-wrap">
      <div class="basket" id="basket"></div>
      <div class="basket-hint">Себетке сүйреп сал 👇</div>
    </div>

    <div class="ground"></div>
  </div>

  <div class="overlay" id="finalOverlay">
    <div class="panel">
      <div class="stars">⭐️🏆⭐️</div>
      <h2>Тамаша!</h2>
      <p>Сен барлық мақалдарды дұрыс таптың!</p>
      <button class="replay-btn" id="replayBtn">Қайтадан ойнау</button>
    </div>
  </div>

  <audio id="proverbAudio" preload="auto"></audio>
  <audio id="correctAudio" src="correct.mp3" preload="auto"></audio>
  <audio id="successAudio" src="success.mp3" preload="auto"></audio>

<script>
(function(){
  "use strict";

  /* ---------------- game data ---------------- */
  var ROUNDS = [
    {
      audio:"audio/maqal1.mp3",
      text:"«Оқу – білім азығы, Білім – ырыс қазығы»",
      options:[
        { id:"book",  label:"Кітап",  img:"book.png",  emoji:"📖", correct:true,
          slot:{ left:"18%", top:"46%" } },
        { id:"pen",   label:"Қалам",  img:"pen.png",   emoji:"✏️", correct:false,
          slot:{ left:"58%", top:"18%" } },
        { id:"apple", label:"Алма",   img:"apple.png", emoji:"🍎", correct:false,
          slot:{ left:"62%", top:"52%" } }
      ]
    },
    {
      audio:"audio/maqal2.mp3",
      text:"«Ат – ердің қанаты»",
      options:[
        { id:"horse", label:"Жылқы",  img:"horse.png", emoji:"🐴", correct:true,
          slot:{ left:"20%", top:"22%" } },
        { id:"bird",  label:"Құс",    img:"bird.png",  emoji:"🐦", correct:false,
          slot:{ left:"60%", top:"50%" } },
        { id:"car",   label:"Машина", img:"car.png",   emoji:"🚗", correct:false,
          slot:{ left:"56%", top:"16%" } }
      ]
    },
    {
      audio:"audio/maqal3.mp3",
      text:"«Отан – отбасынан басталады»",
      options:[
        { id:"home",  label:"Үй/Отбасы", img:"home.png",  emoji:"🏠", correct:true,
          slot:{ left:"60%", top:"46%" } },
        { id:"flower",label:"Гүл",       img:"flower.png",emoji:"🌸", correct:false,
          slot:{ left:"18%", top:"20%" } },
        { id:"sun",   label:"Күн",       img:"sun.png",   emoji:"☀️", correct:false,
          slot:{ left:"22%", top:"52%" } }
      ]
    }
  ];

  var COLORS = ["#FF5A5F","#FF9F45","#FFCD3C"];

  var state = { round:0, locked:false };

  var treeEl = document.getElementById("tree");
  var basketEl = document.getElementById("basket");
  var progressEl = document.getElementById("progress");
  var captionEl = document.getElementById("proverbCaption");
  var listenBtn = document.getElementById("listenBtn");
  var proverbAudio = document.getElementById("proverbAudio");
  var correctAudio = document.getElementById("correctAudio");
  var successAudio = document.getElementById("successAudio");
  var finalOverlay = document.getElementById("finalOverlay");
  var replayBtn = document.getElementById("replayBtn");

  function safePlay(audioEl){
    try{
      var p = audioEl.play();
      if(p && p.catch){ p.catch(function(){ /* autoplay blocked, ignore */ }); }
    }catch(e){ /* ignore */ }
  }

  /* ---------------- progress dots ---------------- */
  function buildProgress(){
    progressEl.innerHTML = "";
    for(var i=0;i<ROUNDS.length;i++){
      var d = document.createElement("div");
      d.className = "dot";
      d.id = "dot"+i;
      progressEl.appendChild(d);
    }
  }
  function updateProgress(){
    for(var i=0;i<ROUNDS.length;i++){
      var d = document.getElementById("dot"+i);
      d.className = "dot" + (i < state.round ? " done" : "") + (i === state.round ? " active" : "");
    }
  }

  /* ---------------- round setup ---------------- */
  function loadRound(idx){
    state.round = idx;
    state.locked = false;
    treeEl.querySelectorAll(".apple-slot").forEach(function(el){ el.remove(); });
    var round = ROUNDS[idx];
    captionEl.textContent = round.text;
    updateProgress();

    round.options.forEach(function(opt, i){
      var slot = document.createElement("div");
      slot.className = "apple-slot";
      slot.style.left = opt.slot.left;
      slot.style.top = opt.slot.top;

      var apple = document.createElement("div");
      apple.className = "apple";
      apple.dataset.correct = opt.correct ? "1" : "0";
      apple.dataset.label = opt.label;
      apple.style.background = "radial-gradient(circle at 32% 30%, #FFEDEE, " + COLORS[i%COLORS.length] + " 55%, #C93A2E 100%)";

      var img = document.createElement("img");
      img.src = opt.img;
      img.alt = opt.label;
      img.onerror = function(){
        img.remove();
        var span = document.createElement("span");
        span.className = "emoji-fallback";
        span.textContent = opt.emoji;
        apple.insertBefore(span, apple.firstChild.nextSibling);
      };
      apple.appendChild(img);

      var lbl = document.createElement("div");
      lbl.className = "label";
      lbl.textContent = opt.label;
      apple.appendChild(lbl);

      slot.appendChild(apple);
      treeEl.appendChild(slot);

      enableDrag(apple, slot);
    });

    proverbAudio.src = round.audio;
    setTimeout(function(){ playCurrentProverb(); }, 400);
  }

  function playCurrentProverb(){
    listenBtn.classList.add("speaking");
    safePlay(proverbAudio);
  }
  proverbAudio.addEventListener("ended", function(){ listenBtn.classList.remove("speaking"); });
  proverbAudio.addEventListener("error", function(){ listenBtn.classList.remove("speaking"); });
  listenBtn.addEventListener("click", playCurrentProverb);

  /* ---------------- drag & drop (mouse + touch) ---------------- */
  function enableDrag(apple, originSlot){
    var dragging = false;
    var startX=0, startY=0, origLeft=0, origTop=0;
    var placeholder = null;

    function getPoint(e){
      if(e.touches && e.touches.length){ return { x:e.touches[0].clientX, y:e.touches[0].clientY }; }
      if(e.changedTouches && e.changedTouches.length){ return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY }; }
      return { x:e.clientX, y:e.clientY };
    }

    function pointerDown(e){
      if(state.locked) return;
      e.preventDefault();
      dragging = true;
      var pt = getPoint(e);
      startX = pt.x; startY = pt.y;

      var rect = apple.getBoundingClientRect();
      origLeft = rect.left; origTop = rect.top;

      apple.style.width = rect.width+"px";
      apple.style.height = rect.height+"px";
      apple.style.position = "fixed";
      apple.style.left = rect.left+"px";
      apple.style.top = rect.top+"px";
      apple.style.margin = "0";
      apple.classList.add("picked-up");
      apple.style.zIndex = 50;
      document.body.appendChild(apple);

      window.addEventListener("mousemove", pointerMove);
      window.addEventListener("touchmove", pointerMove, { passive:false });
      window.addEventListener("mouseup", pointerUp);
      window.addEventListener("touchend", pointerUp);
    }

    function pointerMove(e){
      if(!dragging) return;
      e.preventDefault();
      var pt = getPoint(e);
      var dx = pt.x - startX;
      var dy = pt.y - startY;
      apple.style.left = (origLeft + dx) + "px";
      apple.style.top = (origTop + dy) + "px";

      var basketRect = basketEl.getBoundingClientRect();
      var appleRect = apple.getBoundingClientRect();
      var overlap = rectsOverlap(appleRect, basketRect);
      basketEl.classList.toggle("drop-hover", overlap);
    }

    function pointerUp(e){
      if(!dragging) return;
      dragging = false;
      window.removeEventListener("mousemove", pointerMove);
      window.removeEventListener("touchmove", pointerMove);
      window.removeEventListener("mouseup", pointerUp);
      window.removeEventListener("touchend", pointerUp);
      basketEl.classList.remove("drop-hover");

      var basketRect = basketEl.getBoundingClientRect();
      var appleRect = apple.getBoundingClientRect();
      var dropped = rectsOverlap(appleRect, basketRect);

      apple.classList.remove("picked-up");

      if(dropped){
        handleDrop(apple, appleRect);
      }else{
        returnHome(apple, originSlot);
      }
    }

    apple.addEventListener("mousedown", pointerDown);
    apple.addEventListener("touchstart", pointerDown, { passive:false });
  }

  function rectsOverlap(a,b){
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }

  function returnHome(apple, originSlot){
    apple.classList.add("wrong-shake");
    var rect = originSlot.getBoundingClientRect();
    apple.style.transition = "left .35s ease, top .35s ease";
    apple.style.left = rect.left + "px";
    apple.style.top = rect.top + "px";
    setTimeout(function(){
      apple.classList.remove("wrong-shake");
      apple.style.transition = "";
      originSlot.appendChild(apple);
      apple.style.position = "";
      apple.style.left = "";
      apple.style.top = "";
      apple.style.width = "";
      apple.style.height = "";
      apple.style.margin = "";
      apple.style.zIndex = "";
    }, 360);
  }

  function handleDrop(apple, appleRect){
    if(state.locked) return;
    var isCorrect = apple.dataset.correct === "1";
    if(isCorrect){
      state.locked = true;
      safePlay(correctAudio);
      flyIntoBasket(apple, appleRect);
      clearRemainingApples();
      setTimeout(function(){
        if(state.round < ROUNDS.length - 1){
          loadRound(state.round + 1);
        }else{
          finishGame();
        }
      }, 900);
    }else{
      var slot = apple.parentElement && apple.parentElement.classList.contains("apple-slot")
        ? apple.parentElement
        : findOriginalSlot(apple);
      returnHome(apple, slot || treeEl);
    }
  }

  function findOriginalSlot(apple){
    var slots = treeEl.querySelectorAll(".apple-slot");
    for(var i=0;i<slots.length;i++){
      if(slots[i].dataset.label === apple.dataset.label) return slots[i];
    }
    return treeEl;
  }

  function flyIntoBasket(apple, appleRect){
    var basketRect = basketEl.getBoundingClientRect();
    apple.style.transition = "left .45s ease-in, top .45s ease-in, transform .45s ease-in";
    apple.style.left = (basketRect.left + basketRect.width/2 - appleRect.width/2) + "px";
    apple.style.top = (basketRect.top - appleRect.height/2) + "px";
    apple.style.transform = "scale(0.5) rotate(20deg)";
    setTimeout(function(){ apple.remove(); }, 460);
  }

  function clearRemainingApples(){
    var apples = treeEl.querySelectorAll(".apple");
    apples.forEach(function(a){
      a.style.transition = "opacity .35s, transform .35s";
      a.style.opacity = "0";
      a.style.transform = "scale(0.6)";
      setTimeout(function(){ a.remove(); }, 360);
    });
  }

  /* ---------------- finish & confetti ---------------- */
  function finishGame(){
    updateProgress();
    document.getElementById("dot"+(ROUNDS.length-1)).classList.add("done");
    safePlay(successAudio);
    launchConfetti();
    setTimeout(function(){ finalOverlay.classList.add("show"); }, 500);
  }

  function launchConfetti(){
    var colors = ["#FF5A5F","#FFCD3C","#8A5CF6","#4CAE4C","#5EC4E8","#FF6FA5"];
    for(var i=0;i<60;i++){
      (function(){
        var piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = (Math.random()*100)+"vw";
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (2.2 + Math.random()*1.8)+"s";
        piece.style.opacity = String(0.7+Math.random()*0.3);
        var isRound = Math.random() > 0.5;
        if(isRound){ piece.style.borderRadius = "50%"; }
        document.body.appendChild(piece);
        setTimeout(function(){ piece.remove(); }, 4200);
      })();
    }
  }

  replayBtn.addEventListener("click", function(){
    finalOverlay.classList.remove("show");
    loadRound(0);
  });

  /* ---------------- boot ---------------- */
  buildProgress();
  loadRound(0);

})();
</script>
</body>
</html>
